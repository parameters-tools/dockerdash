[package]
name = "dockerdash"
version = "0.1.0"
edition = "2021"
description = "Real-time Docker container stats in your terminal"
license = "MIT"

[dependencies]
bollard = "0.17"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.29"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
serde_json = "1"
